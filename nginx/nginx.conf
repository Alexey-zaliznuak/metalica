upstream backend_upstream {
    server backend:3000;
}

upstream frontend_upstream {
    server frontend:80;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;

    # Должно совпадать с MAX_UPLOAD_MB бэкенда. ВНИМАНИЕ: тот же лимит нужен и
    # во внешнем nginx на хосте — иначе он срежет запрос с 413 раньше, и в
    # логах backend-контейнера про эту загрузку не будет ни строки.
    # Чуть больше лимита файла 1 ГБ, чтобы поместились multipart-заголовки.
    client_max_body_size 1100m;

    # Крупный файл на медленном канале заливается долго: с дефолтными 60s
    # nginx закрывал бы соединение посреди загрузки.
    client_body_timeout 600s;

    # API -> NestJS backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket (Socket.IO) -> NestJS backend
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Public, read-only objects from MinIO.
    # /files/2026-08-09/file.jpg -> /<bucket>/2026-08-09/file.jpg
    location /files/ {
        rewrite ^/files/(.*)$ /${MINIO_BUCKET}/$1 break;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else -> static SPA (served by the frontend container's nginx)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
